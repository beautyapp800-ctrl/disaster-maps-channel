name: contentid
# Content ID test of the 4 music tracks: a private test upload on Storm Atlas USA, watched for up to 2.5 h, verdict committed to state/contentid.json.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install google-auth google-api-python-client numpy pillow pyshp shapely
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Test upload and Content ID watch
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
        run: python -m automation.contentid run
      - name: Commit the verdict
        if: always()
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add state/contentid.json || true
          git commit -m "state: Content ID test of the music tracks" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase --autostash origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 10; done
