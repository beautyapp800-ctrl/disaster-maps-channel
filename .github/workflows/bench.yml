name: bench
# Manual render benchmark: 1080p vs 4K (2D map frames, 3D relief frames on CPU OpenGL, x264 encode).
on:
  workflow_dispatch:
    inputs:
      frames:
        description: "frames per test"
        default: "120"
concurrency:
  group: disaster-render
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        res: ["1080", "2160"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy pillow pyshp moderngl
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1-mesa-dri >/dev/null
      - name: NOAA SPC tornado database 1950-2025 (public domain, NWS)
        run: mkdir -p data/raw && curl -sfL --retry 3 -A "Mozilla/5.0" -o data/raw/tornadoes.csv https://www.spc.noaa.gov/wcm/data/1950-2025_actual_tornadoes.csv
      - name: Benchmark
        env:
          RES: ${{ matrix.res }}
          N2D: ${{ inputs.frames }}
          N3D: ${{ inputs.frames }}
        run: nproc && free -g && python bench/bench.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.res }}
          path: |
            bench/out/*.json
            bench/out/*.jpg
          retention-days: 14
