name: upload
# Uploads the next reserve video as PRIVATE with publishAt (Wed and Sat 20:00 Kyiv). Nothing happens without the token, without a clear
# music Content ID test, or when the channel cannot be read in full. Never two uploads at once.
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = only show what would be uploaded"
        default: "0"
permissions:
  contents: write
concurrency:
  group: youtube
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install google-auth google-api-python-client numpy pillow pyshp shapely
      - name: Upload
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == '1' && '1' || '' }}
        run: python -m automation.publish
