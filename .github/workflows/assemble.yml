name: assemble
# Re-run only the assemble/QA step on the segments of an earlier pilot run (artifacts are kept 7 days).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "pilot run id that holds the seg-* artifacts"
        required: true
      res:
        description: "video height of that run"
        default: "2160"
permissions:
  contents: read
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy pillow pyshp
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: mkdir -p data/raw && curl -sfL --retry 3 -A "Mozilla/5.0" -o data/raw/tornadoes.csv https://www.spc.noaa.gov/wcm/data/1950-2025_actual_tornadoes.csv
      - uses: actions/download-artifact@v4
        with:
          pattern: seg-*
          path: segs
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: |
          EXP=$(python3 scripts/total_seconds.py)
          python scripts/assemble.py segs out/final $EXP ${{ inputs.res }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review
          path: |
            out/final/preview_480p.mp4
            out/final/contact_sheet.jpg
            out/final/qa_report.md
            out/final/verify.json
          retention-days: 30
